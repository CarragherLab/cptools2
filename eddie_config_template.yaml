# Eddie-Optimized cptools2 Configuration Template
# Copy this file and modify the paths for your specific analysis

# Required: CellProfiler pipeline file
pipeline: /exports/igmm/datastore/groups/YOUR_GROUP/pipelines/your_pipeline.cppipe

# Required: Base location for analysis (use Eddie scratch space)
location: /exports/eddie/scratch/$USER/analysis_YYYYMMDD_PROJECT

# Required: Commands directory (usually under location)
commands location: /exports/eddie/scratch/$USER/analysis_YYYYMMDD_PROJECT/commands

# Required: Chunk size for array jobs (96 is optimal for most Eddie analyses)
chunk: 96

# Required: ImageXpress format (true for newer IX systems, false for legacy)
new_ix: true

# Optional: Add specific plates from an experiment
# Uncomment and modify as needed:
# add plate:
#   - experiment: /exports/igmm/datastore/groups/YOUR_GROUP/raw_data/EXPERIMENT_NAME
#     plates: 
#       - PLATE_001
#       - PLATE_002

# Optional: Add entire experiment (all plates)
# Uncomment and modify as needed:
# experiment: /exports/igmm/datastore/groups/YOUR_GROUP/raw_data/EXPERIMENT_NAME

# Optional: Remove specific plates from analysis
# remove plate:
#   - PLATE_TO_EXCLUDE

# Optional: Join result files after analysis completes
# Common CellProfiler output files to combine:
join_files:
  - Image.csv
  - Cells.csv
  - Nuclei.csv
  - Cytoplasm.csv

# Optional: Automatically transfer joined results to DataStore
# Specify your group's DataStore location:
data_destination: /exports/igmm/datastore/groups/YOUR_GROUP/results/analysis_YYYYMMDD_PROJECT

# Eddie-Specific Usage Notes:
# 1. Always run generation on a staging node: qlogin -q staging
# 2. Use scratch space for 'location' - never use home directory
# 3. Keep DataStore paths in 'data_destination' for final results
# 4. Monitor job progress with: qstat -u $USER
# 5. Check batch logs in: location/logfiles/
