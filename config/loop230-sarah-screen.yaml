# Loop 230 representative Eddie test.
#
# Runtime assets are expected to be copied into the scratch project before
# execution:
#   ${CPTOOLS2_SCRATCH_ROOT}/loop230/pipelines/
#   ${CPTOOLS2_SCRATCH_ROOT}/loop230/config/

input_dir: /exports/<college>/datastore/<project>/imagexpress/<screen>
output_dir: ${CPTOOLS2_SCRATCH_ROOT}/loop230

plates:
  - example-plate-001

plate_sizes_gb:
  example-plate-001: 103

stage_data: true
data_destination: ${CPTOOLS2_PROJECT_ROOT}/results/loop230

illum_pipeline_calculate: ${CPTOOLS2_SCRATCH_ROOT}/loop230/pipelines/illum_calculate.cppipe
illum_pipeline_apply: ${CPTOOLS2_SCRATCH_ROOT}/loop230/pipelines/illum_apply.cppipe
seg_pipeline: ${CPTOOLS2_SCRATCH_ROOT}/loop230/pipelines/nuclear_segmentation.cppipe
pipeline: ${CPTOOLS2_SCRATCH_ROOT}/loop230/pipelines/nuclear_segmentation.cppipe

commands location: ${CPTOOLS2_SCRATCH_ROOT}/loop230/commands
container_path: ${CPTOOLS2_CONTAINER_DIR}

channels:
  - DNA
  - RNA
  - ER
  - AGP
  - Mito

stages:
  - illum
  - segment
  - extract

segmentation:
  engine: cellpose
  model: cpsam
  channel: 1
  batch_size: 8

feature_extraction:
  tool: deepprofiler
  config: ${CPTOOLS2_SCRATCH_ROOT}/loop230/config/deepprofiler_config.json
  batch_size: 128
