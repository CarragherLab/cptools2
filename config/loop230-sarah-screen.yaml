# Loop 230 representative Eddie test.
#
# Runtime assets are expected to be copied into the scratch project before
# execution:
#   /exports/eddie/scratch/mharvey2/cptools2-loop230/pipelines/
#   /exports/eddie/scratch/mharvey2/cptools2-loop230/config/

input_dir: /exports/igmm/datastore/ImageXpress2020/imagexpress/Sarah-screen
output_dir: /exports/eddie/scratch/mharvey2/cptools2-loop230

plates:
  - 3723-D-100

plate_sizes_gb:
  3723-D-100: 103

stage_data: true
data_destination: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/results/loop230

illum_pipeline_calculate: /exports/eddie/scratch/mharvey2/cptools2-loop230/pipelines/illum_calculate.cppipe
illum_pipeline_apply: /exports/eddie/scratch/mharvey2/cptools2-loop230/pipelines/illum_apply.cppipe
seg_pipeline: /exports/eddie/scratch/mharvey2/cptools2-loop230/pipelines/nuclear_segmentation.cppipe
pipeline: /exports/eddie/scratch/mharvey2/cptools2-loop230/pipelines/nuclear_segmentation.cppipe

commands location: /exports/eddie/scratch/mharvey2/cptools2-loop230/commands
container_path: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/containers

channels:
  - DNA
  - RNA
  - ER
  - AGP
  - Mito

stages:
  - illum
  - segment
  - extract

segmentation:
  engine: cellpose
  model: cpsam
  channel: 1
  batch_size: 8

feature_extraction:
  tool: deepprofiler
  config: /exports/eddie/scratch/mharvey2/cptools2-loop230/config/deepprofiler_config.json
  batch_size: 128
