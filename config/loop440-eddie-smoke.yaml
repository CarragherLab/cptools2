# Phase 2.8 Loop 440 end-to-end smoke candidate.
#
# This file records the intended Eddie runtime contract for a future tiny
# end-to-end smoke. It is not a production config and should not be pointed at
# the full Sarah-screen plate unless broad staging is explicitly approved.

input_dir: /exports/eddie/scratch/mharvey2/cptools2-ai-update/staging/tiny-plate-set
output_dir: /exports/eddie/scratch/mharvey2/cptools2-ai-update/results/loop440

plates:
  - tiny-plate-001

plate_sizes_gb:
  tiny-plate-001: 1

stage_data: false
max_chunks: 1
scratch_quota_gb: 200
scratch_utilisation_fraction: 0.75
scratch_work_factor: 3.5

container_path: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/containers

illum_pipeline_calculate: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/cptools2/templates/illum_calculate.cppipe
illum_pipeline_apply: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/cptools2/templates/illum_apply.cppipe
seg_pipeline: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/cptools2/templates/nuclear_segmentation.cppipe
pipeline: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/cptools2/templates/nuclear_segmentation.cppipe

commands location: /exports/eddie/scratch/mharvey2/cptools2-ai-update/commands/loop440

channels:
  - DNA
  - RNA
  - ER
  - AGP
  - Mito

expected_channels:
  - 1
  - 2
  - 3
  - 4
  - 5

stages:
  - segment
  - extract

segmentation:
  engine: cellpose
  model: cpsam
  channel: 1
  batch_size: 1

feature_extraction:
  tool: deepprofiler
  config: /exports/cmvm/eddie/smgphs/groups/ChandranLabs/cptools2/cptools2/templates/deepprofiler_config.json
  batch_size: 8
